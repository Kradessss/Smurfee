<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Smurfee Cart</title>

<link rel="icon" type="image/png" href="images/web-logo.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="navbar">

        <div class="logo">
            <img src="images/logo.png"
            alt="Smurfee Logo">
        </div>

        <div class="header-icons">

            <a href="index.html">🏠</a>
            <a href="wishlist.html">❤️</a>

        </div>

    </div>

</header>

<section class="cart-container">

    <h2 class="section-title">
        🛒 Shopping Cart
    </h2>

    <div class="page-banner">

        <h3>
            Ready to Checkout?
        </h3>

        <p>
            Review your items before
            placing your order.
        </p>

    </div>

    <div id="cartItems"></div>

    <p id="emptyCartMsg"
    style="display:none;">
        Your cart is empty 🛒
    </p>

    <div class="cart-summary">

        <h3 id="total">
            Total: ₱0
        </h3>

        <div class="order-preview">

            <h3>
                Order Preview
            </h3>

            <div id="previewItems"></div>

        </div>

        <button
        class="btn"
        onclick="
        window.location.href=
        'payment.html'
        ">
            Proceed to Payment
        </button>

    </div>

</section>

<footer>
    <p>
        © 2026 Smurfee Marketplace
    </p>
</footer>

<script src="cart.js"></script>

</body>
</html>
