<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders - Smurfee</title>

<link rel="icon" type="image/png" href="images/web-logo.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->

<header>

    <div class="navbar">

        <div class="logo">
            <img src="images/logo.png"
                 alt="Smurfee Logo">
        </div>

        <div class="header-icons">

            <a href="index.html" class="nav-icon">

                <svg xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    fill="currentColor"
                    class="bi bi-house-door-fill"
                    viewBox="0 0 16 16">

                <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>

                </svg>

            </a>

            <a href="cart.html" class="nav-icon">
                🛒
            </a>

            <div id="userArea"></div>

        </div>

    </div>

</header>

<!-- PAGE HERO -->

<section class="orders-hero">

    <h1>📦 My Orders</h1>

    <p>
        Track your purchases and view
        your Smurfee order history.
    </p>

</section>

<!-- ORDERS -->

<section class="orders-container">

    <div class="orders-header">

        <h2>
            Recent Orders
        </h2>

    </div>

    <div id="orderHistory"></div>

</section>

<!-- FOOTER -->

<footer>

    <p>
        © 2026 Smurfee Marketplace
    </p>

</footer>

<script src="cart.js"></script>

<script>
displayOrders();
</script>
<script
type="module"
src="auth-ui.js">
</script>

<script type="module">

import { auth } from "./firebase.js";

auth.onAuthStateChanged(user => {

    if(!user){

        localStorage.removeItem("orders");

        alert(
            "Please login first to view orders."
        );

        window.location.href =
            "login.html";

        return;
    }

    displayOrders();

});

</script>


</body>
</html>
