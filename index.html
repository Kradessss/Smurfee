<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smurfee</title>

<link rel="icon" type="image/png" href="images/web-logo.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="top-links">
        <a href="seller-center.html">
            🏪 Seller Center
        </a>
    </div>

    <div class="top-links">
        <a href="wishlist.html">❤️ Wishlist</a>
        <a href="order.html">📦 Orders</a>
    </div>
</div>

<!-- HEADER -->
<header>

    <div class="navbar">

        <div class="logo">
            <img src="images/logo.png" alt="Smurfee Logo">
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products on Smurfee..."
            >
        </div>

        <div class="header-icons">

            <a href="wishlist.html">
                ❤️
            </a>

            <a href="cart.html">
                🛒
                <span id="cartCount">0</span>
            </a>

        </div>

    </div>

</header>

<!-- HERO -->
<section class="hero">

    <div class="hero-content">

        <h1>Smurfee Super Sale </h1>

        <p>
            Discover amazing tech deals from the Smurf Village Marketplace
        </p>

        <button
            class="hero-btn"
            onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
            Shop Now
        </button>

    </div>

</section>

<!-- CATEGORIES -->
<section class="categories" id="categories">

    <h2>Categories</h2>

    <div class="category-grid">

        <div class="category" onclick="filterCategory('All')">
            All
        </div>

        <div class="category" onclick="filterCategory('Gaming')">
            Gaming
        </div>

        <div class="category" onclick="filterCategory('Audio')">
            Audio
        </div>

        <div class="category" onclick="filterCategory('Accessories')">
            Accessories
        </div>

        <div class="category" onclick="filterCategory('Computers')">
            Computers
        </div>

    </div>

</section>

<!-- FLASH DEALS -->
<section class="flash-deals">

    <div class="flash-header">

        <h2>⚡ Flash Deals</h2>

        <div id="countdown">
            02:00:00
        </div>

    </div>

</section>

<!-- PRODUCTS -->
<section class="products" id="products">

    <h2 class="section-title">
        Featured Products
    </h2>

    <div class="product-grid" id="productGrid">

    </div>

</section>

<!-- FOOTER -->
<footer>

    <p>
        © 2026 Smurfee Marketplace
    </p>

</footer>

<script src="cart.js"></script>
<script src="search.js"></script>

<script>

/* FLASH DEAL TIMER */

let seconds = 7200;

setInterval(() => {

    let h = Math.floor(seconds / 3600);

    let m = Math.floor((seconds % 3600) / 60);

    let s = seconds % 60;

    document.getElementById("countdown").innerText =
        String(h).padStart(2,"0") + ":" +
        String(m).padStart(2,"0") + ":" +
        String(s).padStart(2,"0");

    if(seconds > 0){
        seconds--;
    }

},1000);

</script>
<script src="products.js"></script>
</body>
</html>
