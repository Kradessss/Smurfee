<!DOCTYPE html>
<html lang="en">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="images/web-logo.png">

<link rel="stylesheet" href="style.css">

        <div class="logo">
            <img src="images/logo.png"
            alt="Smurfee Logo">

            <a href="index.html">🏠</a>

            <a href="cart.html">

<section class="cart-container">
