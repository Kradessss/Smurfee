<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Product Details</title>

<link rel="icon" type="image/png" href="images/web-logo.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="navbar">

        <div class="logo">
            <img src="images/logo.png"
                 alt="Smurfee Logo">
        </div>

        <div class="header-icons">

            <a href="index.html" class="nav-icon">

                <svg xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    fill="currentColor"
                    class="bi bi-house-door-fill"
                    viewBox="0 0 16 16">

                <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>

                </svg>

            </a>

            <a href="cart.html" class="nav-icon">
                🛒
            </a>

            <a href="wishlist.html" class="nav-icon">❤️</a>
            <div id="userArea"></div>

        </div>

    </div>

</header>

<section class="product-page">

    <div id="productDetails"></div>

</section>

<script src="cart.js"></script>
<script src="products.js"></script>


<script type="module">

import {
    db,
    auth,
    collection,
    addDoc,
    getDocs,
    query,
    where
}
from "./firebase.js";

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    Number(
        params.get("id")
    );

const product =
    products.find(
        p => p.id === id
    );

const container =
    document.getElementById(
        "productDetails"
    );

if(product){

container.innerHTML = `

<div class="product-layout">

    <div>

        <img
            src="${product.image}"
            class="product-image"
        >

    </div>

    <div>

        <h1>
            ${product.name}
        </h1>

        <div class="rating">
            ${"⭐".repeat(product.rating)}
        </div>

        <p class="seller">
            Sold by:
            ${product.seller}
        </p>

        <p class="price">
            ₱${product.price}
        </p>

        <p>
            🚚 Free Shipping
        </p>

        <p>
            Sold:
            ${product.sold}
        </p>

        <div class="qty-box">

            <button onclick="decreaseQty()">
                -
            </button>

            <span id="qty">
                1
            </span>

            <button onclick="increaseQty()">
                +
            </button>

        </div>

        <br>

        <div class="product-buttons">

            
            <button
            class="btn"
            onclick="handleAddToCart()"
            >

            🛒 Add To Cart

            </button>
            
            <button
            class="wishlist-btn"
            onclick="handleWishlist()"
            >

            ❤️ Wishlist

            </button>


        </div>

        <div class="reviews-section">

            <h3>
                ⭐ Product Reviews
            </h3>

            <div class="review-form">

                <select id="reviewRating">

                    <option value="5">
                        ⭐⭐⭐⭐⭐
                    </option>

                    <option value="4">
                        ⭐⭐⭐⭐
                    </option>

                    <option value="3">
                        ⭐⭐⭐
                    </option>

                    <option value="2">
                        ⭐⭐
                    </option>

                    <option value="1">
                        ⭐
                    </option>

                </select>

                <textarea
                    id="reviewText"
                    placeholder="Write your review..."
                ></textarea>

                <button
                    class="btn"
                    onclick="submitReview(${product.id})"
                >
                    Submit Review
                </button>

            </div>

            <div id="reviewList"></div>

        </div>



            <h3>Description</h3>

            <p>
                High-quality
                ${product.name}
                from
                ${product.seller}.
                Perfect for daily use.
            </p>

        </div>

    </div>

</div>

`;

}

let qty = 1;

function increaseQty(){

    qty++;

    document.getElementById(
        "qty"
    ).innerText = qty;
}

function decreaseQty(){

    if(qty > 1){

        qty--;

        document.getElementById(
            "qty"
        ).innerText = qty;
    }
}

function handleAddToCart(){

    if(!auth.currentUser){

        alert(
            "Please login first to add items to cart."
        );

        window.location.href =
            "login.html";

        return;
    }

    addProductQty(

        product.name,

        product.price,

        parseInt(
            document.getElementById(
                "qty"
            ).innerText
        )

    );

}

function handleWishlist(){

    if(!auth.currentUser){

        alert(
            "Please login first to use wishlist."
        );

        window.location.href =
            "login.html";

        return;
    }

    addToWishlist(

        product.name,

        product.price

    );

}


async function submitReview(productId){

    if(!auth.currentUser){

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

        return;

    }

    const rating =
        document.getElementById(
            "reviewRating"
        ).value;

    const text =
        document.getElementById(
            "reviewText"
        ).value.trim();

    if(text === ""){

        alert(
            "Please write a review."
        );

        return;

    }

    await addDoc(
    collection(db,"review"),
        {

            productId,

            user:
            auth.currentUser.email,

            displayName:
            auth.currentUser.email
            .split("@")[0],

            rating:
            Number(rating),

            text,

            date:
            new Date()
            .toLocaleString()

        }
    );

    document.getElementById(
        "reviewText"
    ).value = "";

    loadReviews(productId);

}

async function loadReviews(productId){

    const container =
        document.getElementById(
            "reviewList"
        );

    container.innerHTML =
        "<p>Loading reviews...</p>";

    const q = query(
        collection(db,"review"),
        where(
            "productId",
            "==",
            productId
        )
    );

    const snapshot =
        await getDocs(q);

    let reviews = [];

    snapshot.forEach(doc => {

        reviews.push(
            doc.data()
        );

    });

    container.innerHTML = "";

    if(reviews.length === 0){

        container.innerHTML =
            "<p>No reviews yet.</p>";

        return;
    }

    let total = 0;

    reviews.reverse().forEach(review => {

        total += Number(
            review.rating
        );

        container.innerHTML += `

        <div class="review-card">

        <div class="review-user">

            👤 ${review.displayName}

        </div>

        <div class="review-stars">

            ${"⭐".repeat(review.rating)}

        </div>

        <p class="review-text">

            ${review.text}

        </p>

        <small>

            ${review.date}

        </small>

        </div>

        `;
    });

    const avg =
        (
            total /
            reviews.length
        ).toFixed(1);

    container.innerHTML = `

    <div class="average-rating">

        ⭐ ${avg}/5
        (${reviews.length}
        reviews)

    </div>

    ` + container.innerHTML;

}

window.submitReview = submitReview;
window.increaseQty = increaseQty;
window.decreaseQty = decreaseQty;

window.handleAddToCart = handleAddToCart;
window.handleWishlist = handleWishlist;
loadReviews(id);



</script>
<footer>
    <p>
        © 2026 Smurfee Marketplace
    </p>
</footer>
<script
type="module"
src="auth-ui.js">
</script>
</body>
</html>
