<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Smurfee</title>

<link rel="icon" type="image/png" href="images/web-logo.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="navbar">

        <div class="logo">
            <img src="images/logo.png"
            alt="Smurfee Logo">
        </div>

        <div class="header-icons">

            <a href="index.html" class="nav-icon">

                <svg xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    fill="currentColor"
                    class="bi bi-house-door-fill"
                    viewBox="0 0 16 16">

                <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>

                </svg>

            </a>

            <a href="cart.html" class="nav-icon">
                🛒
            </a>

            <div id="userArea"></div>

        </div>

    </div>
</header>

<section class="cart-container">

    <h2 class="section-title">
        Checkout
    </h2>

    <div class="payment-box">

        <h3>Choose Payment Method</h3>

        <label class="payment-option">
            <input type="radio" name="payment" value="GCash" checked>
            💙 GCash
        </label>

        <label class="payment-option">
            <input type="radio" name="payment" value="Maya">
            💚 Maya
        </label>

        <label class="payment-option">
            <input type="radio" name="payment" value="Credit Card">
            💳 Credit Card
        </label>

        <label class="payment-option">
            <input type="radio" name="payment" value="Cash on Delivery">
            📦 Cash on Delivery
        </label>

    </div>

    <div class="voucher-box">

        <h3>Voucher</h3>

        <input
            type="text"
            id="voucherInput"
            placeholder="Enter voucher code"
        >

        <button
            class="btn"
            onclick="applyVoucher()"
        >
            Apply Voucher
        </button>

        <p id="voucherMessage"></p>

    </div>

    <div class="cart-summary">

        <h3 id="paymentTotal">
            Total: ₱0
        </h3>

        <button
            class="btn"
            onclick="placeOrder()"
        >
            Place Order
        </button>

    </div>

</section>

<script src="cart.js"></script>

<script>
loadPaymentTotal();
</script>
<script
type="module"
src="auth-ui.js">
</script>
</body>
</html>
